<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>按周排 · 上一周期</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="min-height: 1120px; background: #F5F6F8; color: #111827; font-family: Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 13px">
  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 16px; background: #FFFFFF; border-bottom: 1px solid #E5E7EB">
    <strong style="font-size: 16px">MeetPR</strong>
    <span style="color: #5C6371">学员 <strong style="color: #111827">李小龙</strong></span>
    <button style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 1px solid #E5E7EB; border-radius: 8px; background: #FFFFFF; color: #111827"><span style="color: #5C6371">周期</span><strong>备赛期 · 11/23 · 12 周</strong><span aria-hidden="true">▾</span></button>
    <span style="flex-grow: 1"></span>
    <span style="color: #5C6371">显示实际 关</span>
    <span style="color: #5C6371">草稿 · 已自动保存</span>
    <button style="height: 36px; padding: 0 14px; border: 1px solid #111827; border-radius: 8px; background: #111827; color: #FFFFFF; font-weight: 600">发布</button>
  </div>

  <div style="overflow-x: auto">
  <div style="min-width: 1100px; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: grid; grid-template-columns: 64px repeat(7, minmax(0, 1fr)); gap: 10px; padding: 0 8px; color: #5C6371">
      <span></span><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span>
    </div>

    <sc-for list="{{zones}}" as="zone" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 10px; padding: 8px; border-radius: 12px; background: {{zone.bg}}">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; min-height: 36px">
          <span style="padding: 3px 9px; border-radius: 6px; background: {{zone.chipBg}}; color: #FFFFFF; font-weight: 600; font-size: 12px">{{zone.chip}}</span>
          <strong style="font-size: 14px">{{zone.title}}</strong>
          <span style="color: #5C6371">{{zone.meta}}</span>
          <span style="flex-grow: 1"></span>
          <sc-if value="{{zone.isPrev}}" hint-placeholder-val="{{ true }}">
            <span style="color: #5C6371">显示 {{rangeLabel}}</span>
            <sc-if value="{{canMore}}" hint-placeholder-val="{{ true }}">
              <button onClick="{{more}}" style="height: 30px; padding: 0 10px; border: 1px solid #D1D5DB; border-radius: 7px; background: #FFFFFF; color: #111827">↑ 再往前 1 周</button>
              <button onClick="{{all}}" style="height: 30px; padding: 0 10px; border: 1px solid #D1D5DB; border-radius: 7px; background: #FFFFFF; color: #111827">展开整份</button>
            </sc-if>
            <button onClick="{{fold}}" style="height: 30px; padding: 0 10px; border: 1px solid #D1D5DB; border-radius: 7px; background: #FFFFFF; color: #111827">{{foldLabel}}</button>
          </sc-if>
        </div>

        <sc-if value="{{zone.open}}" hint-placeholder-val="{{ true }}">
          <sc-for list="{{zone.weeks}}" as="week" hint-placeholder-count="2">
            <div style="display: grid; grid-template-columns: 64px repeat(7, minmax(0, 1fr)); gap: 10px">
              <div style="display: flex; flex-direction: column; gap: 4px; padding-top: 8px">
                <strong style="font-family: 'JetBrains Mono', monospace; font-size: 14px">{{week.label}}</strong>
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5C6371">{{week.date}}</span>
                <sc-if value="{{week.now}}" hint-placeholder-val="{{ false }}">
                  <span style="align-self: flex-start; padding: 1px 6px; border-radius: 4px; background: #FDF0C8; color: #6B4700; font-size: 11px">当前周</span>
                </sc-if>
              </div>
              <sc-for list="{{week.days}}" as="day" hint-placeholder-count="7">
                <div style="display: flex; flex-direction: column; min-width: 0">
                  <sc-if value="{{day.rest}}" hint-placeholder-val="{{ false }}">
                    <div style="flex-grow: 1; min-height: 132px; box-sizing: border-box; padding: 10px; border: 1px dashed #D1D5DB; border-radius: 10px; display: flex; flex-direction: column; gap: 30px">
                      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5C6371">{{day.head}}</span>
                      <span style="text-align: center; color: #5C6371">休息日</span>
                    </div>
                  </sc-if>
                  <sc-if value="{{day.train}}" hint-placeholder-val="{{ true }}">
                    <div style="flex-grow: 1; min-height: 132px; box-sizing: border-box; padding: 10px; border: 1px solid #E5E7EB; border-radius: 10px; background: #FFFFFF; display: flex; flex-direction: column; gap: 5px">
                      <div style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5C6371"><span>{{day.head}}</span><span>{{day.mark}}</span></div>
                      <sc-for list="{{day.bricks}}" as="brick" hint-placeholder-count="3">
                        <div style="display: flex; justify-content: space-between; gap: 6px; padding: 4px 8px; border-radius: 6px; background: #F3F4F6; font-size: 12px"><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{brick.name}}</span><span style="font-family: 'JetBrains Mono', monospace; white-space: nowrap">{{brick.rx}}</span></div>
                      </sc-for>
                    </div>
                  </sc-if>
                  <sc-if value="{{day.empty}}" hint-placeholder-val="{{ false }}">
                    <div style="flex-grow: 1; min-height: 132px; box-sizing: border-box; padding: 10px; border: 1px solid #E5E7EB; border-radius: 10px; background: #FFFFFF; display: flex; flex-direction: column; gap: 24px">
                      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5C6371">{{day.head}}</span>
                      <button style="align-self: center; height: 30px; padding: 0 10px; border: 1px dashed #9CA3AF; border-radius: 7px; background: transparent; color: #4B5563">＋ 添加动作</button>
                    </div>
                  </sc-if>
                </div>
              </sc-for>
            </div>
          </sc-for>
        </sc-if>
        <sc-if value="{{zone.foldedHint}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; padding: 0 2px 4px; color: #5C6371">已折叠。上一周期的内容没有变化，展开后可以继续对照、复制或修改。</p>
        </sc-if>
      </section>
    </sc-for>
    <p style="margin: 0; padding: 0 8px; color: #5C6371">当前周期 W3–W12 继续向下……</p>
  </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const shown = s.shown ?? 2;
    const folded = s.folded ?? false;
    const PAT = { 0: 0, 2: 1, 4: 2, 5: 3 };
    const DX = [
      [['深蹲', '5×5', 140], ['暂停卧推', '4×6', 85], ['罗马尼亚硬拉', '3×8', 120]],
      [['竞技卧推', '5×5', 95], ['高杠深蹲', '3×8', 115], ['杠铃划船', '4×8', 70]],
      [['硬拉', '4×4', 170], ['窄握卧推', '4×6', 80], ['腿举', '3×10', 200]],
      [['深蹲', '3×3', 150], ['竞技卧推', '3×3', 102.5], ['引体向上', '4×8', 0]]
    ];
    const md = (t) => { const d = new Date(t); return (d.getUTCMonth() + 1) + '/' + d.getUTCDate(); };
    const week = (start, w, o) => {
      const t0 = start + (w - 1) * 7 * 864e5;
      const done = w <= o.doneThrough;
      const empty = w >= o.emptyFrom;
      const days = [];
      for (let i = 0; i < 7; i++) {
        const k = PAT[i];
        const date = md(t0 + i * 864e5);
        if (k === undefined) { days.push({ rest: true, train: false, empty: false, head: date }); continue; }
        days.push({
          rest: false, train: !empty, empty: empty, head: 'D' + (k + 1) + ' · ' + date,
          mark: done ? '✓ 已练' : '···',
          bricks: DX[k].map((b) => ({ name: b[0], rx: b[1] + (b[2] ? ' · ' + (b[2] + (w - 1) * 2.5 + o.bump) : '') + (done ? ' ✓' : '') }))
        });
      }
      return { label: 'W' + w, date: md(t0), now: w === o.now, days: days };
    };
    const prevStart = Date.UTC(2026, 9, 19), curStart = Date.UTC(2026, 10, 23);
    const prevAll = [1, 2, 3, 4, 5].map((w) => week(prevStart, w, { doneThrough: 4, emptyFrom: 99, bump: 0, now: 5 }));
    const cur = [1, 2].map((w) => week(curStart, w, { doneThrough: 0, emptyFrom: 2, bump: 12.5, now: 0 }));
    return {
      rangeLabel: folded ? '已折叠' : shown >= 5 ? '整份 W1–W5' : 'W' + (6 - shown) + '–W5（最后 ' + shown + ' 周）',
      canMore: !folded && shown < 5,
      foldLabel: folded ? '展开' : '折叠',
      more: () => this.setState({ shown: Math.min(5, shown + 1) }),
      all: () => this.setState({ shown: 5 }),
      fold: () => this.setState({ folded: !folded }),
      zones: [
        { isPrev: true, chip: '上一周期', chipBg: '#4B5563', bg: '#E6E9EF', title: '力量基础', meta: '10/19 起 · 5 周 · 已发布', open: !folded, foldedHint: folded, weeks: prevAll.slice(5 - shown) },
        { isPrev: false, chip: '当前周期', chipBg: '#111827', bg: 'transparent', title: '备赛期', meta: '11/23 起 · 12 周 · 草稿', open: true, foldedHint: false, weeks: cur }
      ]
    };
  }
}
</script>
</body>
</html>
